<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Download DKG Online</title>
  <style>
    * { box-sizing: border-box; }
    html {
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #141414;
      background: linear-gradient(180deg, #fff6bd, #ffffff 34%, #f5f5f5);
    }
    main {
      width: 100%;
      max-width: 560px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .hero {
      padding: max(34px, env(safe-area-inset-top)) 22px 24px;
      text-align: center;
      background: transparent;
      border-bottom: 1px solid #ececec;
    }
    img {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 26px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }
    h1 {
      margin: 18px 0 8px;
      font-size: clamp(32px, 9vw, 44px);
      line-height: 1;
    }
    p {
      margin: 0;
      color: #5f5f5f;
      line-height: 1.45;
      font-size: 17px;
    }
    .content {
      display: grid;
      gap: 16px;
      padding: 24px 18px max(28px, env(safe-area-inset-bottom));
      flex: 1;
      align-content: start;
    }
    .button {
      display: flex;
      width: 100%;
      min-height: 62px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #ffcc00;
      color: #101010;
      font-size: 20px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 14px 26px rgba(255, 204, 0, 0.28);
    }
    .note {
      padding: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #fafafa;
    }
    .note strong {
      display: block;
      margin-bottom: 7px;
      color: #171717;
      font-size: 17px;
    }
    code {
      display: block;
      margin-top: 8px;
      padding: 10px;
      overflow-wrap: anywhere;
      border-radius: 8px;
      background: #eee;
      color: #222;
      font-size: 13px;
    }
    @media (min-width: 760px) {
      body {
        align-items: center;
        padding: 24px;
      }
      main {
        min-height: auto;
        overflow: hidden;
        border: 1px solid #e4e4e4;
        border-radius: 18px;
        box-shadow: 0 18px 46px rgba(0, 0, 0, 0.08);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <img src="icon-512.png" alt="DKG Online">
      <h1>DKG Online</h1>
      <p>Install the school attendance app.</p>
    </section>
    <section class="content">
      <a class="button" href="DKG-Online.apk?v=34" download="DKG-Online.apk">Download Android APK</a>
      <div class="note">
        <strong>Android</strong>
        <p>Download the APK, open it, then tap Install. If Android blocks it, allow install from this browser.</p>
      </div>
      <div class="note">
        <strong>iPhone / iOS</strong>
        <p>iPhone cannot install APK. Open this app link in Safari, tap Share, then Add to Home Screen.</p>
        <code id="ios-link"></code>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('ios-link').textContent = location.origin + '/';
  </script>
</body>
</html>
